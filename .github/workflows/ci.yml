# Run the tests on every push and pull request.
#
# The release workflow runs the same checks before it publishes anything, so this is
# about finding a breakage at review time rather than at tag time.

name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

# A new push to the same branch or PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22' # matches the Dockerfile
  # go.sum is not committed (see .gitignore), so the build has to be allowed to write
  # it, exactly as the Dockerfile does.
  GOFLAGS: -mod=mod

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Key the module cache off go.mod; there is no go.sum to hash.
          cache-dependency-path: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
